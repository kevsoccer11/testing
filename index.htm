<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Closer: Couples Connection & Intimacy Game</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0b0c10',
                        glass: 'rgba(255, 255, 255, 0.05)',
                        glassBorder: 'rgba(255, 255, 255, 0.12)',
                        neonPink: '#ff2a85',
                        neonPurple: '#8a2be2',
                        neonRose: '#f43f5e',
                    },
                    boxShadow: {
                        glowPink: '0 0 25px rgba(255, 42, 133, 0.35)',
                        glowPurple: '0 0 25px rgba(138, 43, 226, 0.35)',
                        glowRose: '0 0 25px rgba(244, 63, 94, 0.35)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Firebase JS SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0c10;
            color: #f3f4f6;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(22, 24, 33, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:active {
            transform: scale(0.96);
        }

        .active-tab-sexuality {
            background: linear-gradient(135deg, #ff2a85, #f43f5e);
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.4);
            color: #ffffff;
        }

        .active-tab-life {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            color: #ffffff;
        }

        .active-tab-secrets {
            background: linear-gradient(135deg, #8a2be2, #d946ef);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.4);
            color: #ffffff;
        }

        .active-filter {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0b0c10;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
        }

        .card-flip-enter {
            animation: cardFlip 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes cardFlip {
            0% {
                opacity: 0.2;
                transform: scale(0.92) translateY(12px) rotateX(-10deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotateX(0deg);
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative overflow-x-hidden selection:bg-neonPink selection:text-white">

    <!-- Ambient Background Glows -->
    <div class="fixed top-0 -left-20 w-72 h-72 bg-neonPink/20 rounded-full blur-[100px] pointer-events-none"></div>
    <div class="fixed bottom-0 -right-20 w-80 h-80 bg-neonPurple/20 rounded-full blur-[100px] pointer-events-none"></div>

    <!-- Header / Room Pairing Bar -->
    <header class="w-full mb-3 z-10 flex items-center justify-between">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-neonPink to-neonPurple flex items-center justify-center font-extrabold text-sm text-white shadow-glowPink">
                C
            </div>
            <div>
                <h1 class="font-extrabold text-lg tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-gray-200 to-gray-400">
                    CLOSER
                </h1>
                <p class="text-[10px] text-gray-400 tracking-wider uppercase font-medium -mt-1">Couples Connection</p>
            </div>
        </div>

        <div class="flex items-center gap-2">
            <button id="roomSyncBtn" onclick="openRoomModal()" class="glass-button px-3 py-1.5 rounded-full text-xs font-semibold text-gray-300 flex items-center gap-1.5 hover:text-white">
                <span id="syncDot" class="w-2 h-2 rounded-full bg-gray-500"></span>
                <span id="roomStatusText">Pair</span>
            </button>
            <button onclick="toggleModal('customCardModal', true)" class="glass-button px-3 py-1.5 rounded-full text-xs font-semibold text-neonPink flex items-center gap-1 hover:bg-neonPink/20">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                <span>Card</span>
            </button>
        </div>
    </header>

    <!-- Module Navigation Tabs -->
    <nav class="w-full mb-3 z-10 grid grid-cols-3 gap-1.5 p-1 glass-panel rounded-2xl">
        <button id="tab-sexuality" onclick="switchModule('sexuality')" class="module-tab py-2.5 rounded-xl text-xs font-bold transition-all text-gray-400 flex flex-col items-center gap-0.5">
            <span>SEXUALITY</span>
            <span class="text-[9px] font-normal opacity-70">Spicy & Intimate</span>
        </button>
        <button id="tab-life" onclick="switchModule('life')" class="module-tab py-2.5 rounded-xl text-xs font-bold transition-all text-gray-400 flex flex-col items-center gap-0.5">
            <span>LIFE</span>
            <span class="text-[9px] font-normal opacity-70">Goals & Alignment</span>
        </button>
        <button id="tab-secrets" onclick="switchModule('secrets')" class="module-tab py-2.5 rounded-xl text-xs font-bold transition-all text-gray-400 flex flex-col items-center gap-0.5">
            <span>SECRETS</span>
            <span class="text-[9px] font-normal opacity-70">Fantasies & Deep</span>
        </button>
    </nav>

    <!-- Intensity Filter Bar -->
    <div class="w-full mb-3 z-10 flex items-center justify-between gap-1 overflow-x-auto pb-1">
        <span class="text-[10px] text-gray-400 font-bold uppercase tracking-wider pl-1">Level:</span>
        <div class="flex items-center gap-1.5">
            <button onclick="setIntensity('all')" class="intensity-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold glass-button text-gray-300" data-level="all">All</button>
            <button onclick="setIntensity('1')" class="intensity-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold glass-button text-gray-300" data-level="1">Lvl 1 Mild</button>
            <button onclick="setIntensity('2')" class="intensity-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold glass-button text-gray-300" data-level="2">Lvl 2 Wild</button>
            <button onclick="setIntensity('3')" class="intensity-btn px-2.5 py-1 rounded-lg text-[11px] font-semibold glass-button text-gray-300" data-level="3">Lvl 3 Spicy</button>
        </div>
    </div>

    <!-- Main Card Deck Stage -->
    <main class="w-full flex-1 z-10 flex flex-col justify-center my-auto min-h-[360px]">
        <div id="cardContainer" onclick="handleCardClick()" class="glass-panel w-full rounded-3xl p-6 relative flex flex-col justify-between min-h-[340px] cursor-pointer shadow-2xl transition-all duration-300 hover:border-gray-500/30 group">
            
            <!-- Top Card Header -->
            <div class="flex items-center justify-between border-b border-white/10 pb-3">
                <span id="cardCategory" class="px-3 py-1 rounded-full text-[10px] font-extrabold uppercase tracking-widest bg-white/10 text-white">
                    Category
                </span>
                
                <div class="flex items-center gap-2">
                    <span id="intensityBadge" class="text-[10px] font-bold text-gray-400">
                        ⚡ Lvl 1
                    </span>
                    <button id="favBtn" onclick="toggleFavorite(event)" class="text-gray-500 hover:text-neonPink transition-colors p-1">
                        <svg id="favIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                    </button>
                </div>
            </div>

            <!-- Card Body / Prompt Text -->
            <div class="py-6 my-auto text-center">
                <p id="cardPrompt" class="text-xl sm:text-2xl font-bold leading-relaxed text-white tracking-wide">
                    Loading cards...
                </p>
                <p class="text-[11px] text-gray-500 font-medium mt-4 tracking-wide group-hover:text-gray-400 transition-colors">
                    Tap anywhere on card to draw next prompt
                </p>
            </div>

            <!-- Card Footer Controls & Action Timer -->
            <div class="border-t border-white/10 pt-3 flex items-center justify-between">
                <div id="deckCounter" class="text-xs font-semibold text-gray-400">
                    Card 0 of 0
                </div>

                <!-- 1-Minute Action Timer -->
                <div onclick="event.stopPropagation()" class="flex items-center gap-1.5 bg-black/40 px-2.5 py-1 rounded-full border border-white/10">
                    <svg class="w-3.5 h-3.5 text-neonPink" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span id="timerDisplay" class="text-xs font-mono font-bold text-gray-200">01:00</span>
                    <button id="timerToggleBtn" onclick="toggleTimer()" class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-neonPink">Start</button>
                    <button onclick="resetTimer()" class="text-[10px] font-extrabold uppercase px-1.5 py-0.5 rounded bg-white/10 hover:bg-white/20 text-gray-400">↺</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Dynamic Context Response Bar -->
    <footer class="w-full mt-3 z-10 flex flex-col gap-2">
        <div class="text-[10px] text-gray-400 uppercase tracking-widest font-extrabold text-center">
            How do you respond?
        </div>
        <div id="responseBar" class="grid grid-cols-3 gap-2">
            <!-- Dynamic Buttons Generated in JS -->
        </div>
    </footer>

    <!-- Add Custom Question Modal -->
    <div id="customCardModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/20 shadow-2xl">
            <button onclick="toggleModal('customCardModal', false)" class="absolute top-4 right-4 text-gray-400 hover:text-white p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <h3 class="text-lg font-bold text-white mb-4">Add Custom Question</h3>

            <div class="space-y-3">
                <div>
                    <label class="text-[11px] font-semibold text-gray-400 uppercase">Module</label>
                    <select id="customModule" class="w-full mt-1 bg-black/50 border border-white/15 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-neonPink">
                        <option value="sexuality">Sexuality (Spicy & Intimate)</option>
                        <option value="life">Life (Goals & Alignment)</option>
                        <option value="secrets">Secrets (Deep & Vulnerable)</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-gray-400 uppercase">Category Name</label>
                    <input type="text" id="customCategory" placeholder="e.g. Future Dreams, Romantic Dares" class="w-full mt-1 bg-black/50 border border-white/15 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-neonPink">
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-gray-400 uppercase">Intensity Level</label>
                    <select id="customIntensity" class="w-full mt-1 bg-black/50 border border-white/15 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-neonPink">
                        <option value="1">Level 1 - Mild & Sweet</option>
                        <option value="2">Level 2 - Wild & Deep</option>
                        <option value="3">Level 3 - Extremely Spicy / Bold</option>
                    </select>
                </div>

                <div>
                    <label class="text-[11px] font-semibold text-gray-400 uppercase">Question Prompt</label>
                    <textarea id="customPrompt" rows="3" placeholder="Type your custom question or action here..." class="w-full mt-1 bg-black/50 border border-white/15 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-neonPink"></textarea>
                </div>

                <button onclick="saveCustomCard()" class="w-full mt-2 py-3 rounded-xl bg-gradient-to-r from-neonPink to-neonPurple font-bold text-sm text-white shadow-glowPink active:scale-95 transition-all">
                    Save & Add to Deck
                </button>
            </div>
        </div>
    </div>

    <!-- Pair Room Sync Modal -->
    <div id="roomModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md hidden">
        <div class="glass-panel w-full max-w-sm rounded-3xl p-6 relative border border-white/20 shadow-2xl">
            <button onclick="toggleModal('roomModal', false)" class="absolute top-4 right-4 text-gray-400 hover:text-white p-1">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
            <h3 class="text-lg font-bold text-white mb-2">Partner Live Sync</h3>
            <p class="text-xs text-gray-400 mb-4">Enter a shared Room Code to sync card draws with your partner in real-time across devices.</p>

            <div class="space-y-3">
                <input type="text" id="roomCodeInput" placeholder="Enter Room Code (e.g. LOVE24)" class="w-full bg-black/50 border border-white/15 rounded-xl p-3 text-sm text-center uppercase tracking-widest text-white font-bold focus:outline-none focus:border-neonPink">

                <button onclick="connectToRoom()" class="w-full py-3 rounded-xl bg-gradient-to-r from-neonPurple to-indigo-600 font-bold text-sm text-white shadow-glowPurple active:scale-95 transition-all">
                    Connect Room
                </button>
                <button onclick="disconnectRoom()" id="disconnectBtn" class="w-full py-2.5 rounded-xl bg-red-500/20 border border-red-500/30 font-semibold text-xs text-red-400 hidden">
                    Disconnect Active Room
                </button>
            </div>
        </div>
    </div>

    <!-- App JavaScript Logic -->
    <script>
        // Seed Card Database
        const SEED_CARDS = [
            // SEXUALITY - Level 1
            { id: 'sex-1', module: 'sexuality', category: 'Romantic Warmup', intensity: 1, prompt: 'What is one specific non-physical turn-on that I do without realizing it?', contextType: 'story' },
            { id: 'sex-2', module: 'sexuality', category: 'Touch & Sensation', intensity: 1, prompt: 'Give your partner a slow 30-second neck and shoulder massage right now.', contextType: 'action' },
            { id: 'sex-3', module: 'sexuality', category: 'Desires', intensity: 1, prompt: 'Where on your body do you wish I touched you more often during non-intimate moments?', contextType: 'consent' },
            
            // SEXUALITY - Level 2
            { id: 'sex-4', module: 'sexuality', category: 'Spicy Action', intensity: 2, prompt: 'Whisper your favorite spicy fantasy about us directly into my ear.', contextType: 'action' },
            { id: 'sex-5', module: 'sexuality', category: 'Foreplay & Mood', intensity: 2, prompt: 'What is a setting or location you’ve dreamed of having a passionate romantic encounter with me?', contextType: 'consent' },
            { id: 'sex-6', module: 'sexuality', category: 'Physical Dare', intensity: 2, prompt: 'Give your partner a lingering 10-second kiss with complete focus.', contextType: 'action' },

            // SEXUALITY - Level 3
            { id: 'sex-7', module: 'sexuality', category: 'Wild Fantasy', intensity: 3, prompt: 'If we could try one totally new roleplay scenario or sensory experience tonight, what would it be?', contextType: 'consent' },
            { id: 'sex-8', module: 'sexuality', category: 'Intimate Truth', intensity: 3, prompt: 'What is something I did in the bedroom that blew your mind and you still think about?', contextType: 'story' },

            // LIFE - Level 1
            { id: 'life-1', module: 'life', category: 'Shared Goals', intensity: 1, prompt: 'What is one destination or trip we haven’t taken yet that is top priority on your bucket list?', contextType: 'alignment' },
            { id: 'life-2', module: 'life', category: 'Daily Appreciation', intensity: 1, prompt: 'What small ritual or moment in our daily routine brings you the most comfort?', contextType: 'story' },
            { id: 'life-3', module: 'life', category: 'Growth', intensity: 1, prompt: 'In what way do you think we have grown strongest as a team over the last year?', contextType: 'alignment' },

            // LIFE - Level 2
            { id: 'life-4', module: 'life', category: 'Values & Priorities', intensity: 2, prompt: 'If we were given $50,000 today purely to spend on an experience together, how should we use it?', contextType: 'alignment' },
            { id: 'life-5', module: 'life', category: 'Future Vision', intensity: 2, prompt: 'What does our ideal life look like 5 years from now in terms of work, home, and peace?', contextType: 'alignment' },

            // LIFE - Level 3
            { id: 'life-6', module: 'life', category: 'Hard Conversations', intensity: 3, prompt: 'Is there any personal stress or fear you are currently carrying that you haven’t fully shared with me?', contextType: 'story' },

            // SECRETS - Level 1
            { id: 'sec-1', module: 'secrets', category: 'Early Memories', intensity: 1, prompt: 'What was your exact first impression of me the moment we met?', contextType: 'story' },
            { id: 'sec-2', module: 'secrets', category: 'Vulnerability', intensity: 1, prompt: 'What is something you do when you are stressed that means you need extra comfort from me?', contextType: 'story' },

            // SECRETS - Level 2
            { id: 'sec-3', module: 'secrets', category: 'Confessions', intensity: 2, prompt: 'What is a secret vulnerability or insecurity you rarely talk about with anyone else?', contextType: 'story' },
            { id: 'sec-4', module: 'secrets', category: 'Deep Desires', intensity: 2, prompt: 'What is a boundary or rule in life you wish we could break together just once?', contextType: 'consent' },

            // SECRETS - Level 3
            { id: 'sec-5', module: 'secrets', category: 'Unspoken Dreams', intensity: 3, prompt: 'What is one deep wish for yourself that you feel nervous to admit out loud?', contextType: 'story' }
        ];

        // Context Response Button Templates
        const CONTEXT_RULES = {
            consent: [
                { label: 'Yes / Into It', class: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
                { label: 'Maybe / Discuss', class: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
                { label: 'Hard Pass', class: 'bg-rose-500/20 text-rose-300 border-rose-500/30' }
            ],
            action: [
                { label: 'Doing It Now! 🔥', class: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
                { label: 'Negotiate 💬', class: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
                { label: 'Pass / Swap ⏭️', class: 'bg-rose-500/20 text-rose-300 border-rose-500/30' }
            ],
            alignment: [
                { label: '100% Agree', class: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
                { label: 'Compromise', class: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
                { label: 'Disagree', class: 'bg-rose-500/20 text-rose-300 border-rose-500/30' }
            ],
            story: [
                { label: 'Love Sharing 💬', class: 'bg-emerald-500/20 text-emerald-300 border-emerald-500/30' },
                { label: 'Follow-up ❓', class: 'bg-amber-500/20 text-amber-300 border-amber-500/30' },
                { label: 'Skip Topic ⏭️', class: 'bg-rose-500/20 text-rose-300 border-rose-500/30' }
            ]
        };

        // App State Variables
        let masterCards = [];
        let activeModule = 'sexuality';
        let activeIntensity = 'all';
        let unspentDeck = [];
        let currentCard = null;
        let favoriteIds = JSON.parse(localStorage.getItem('closer_favs') || '[]');
        
        // Timer Variables
        let timerSeconds = 60;
        let timerInterval = null;
        let isTimerRunning = false;

        // Firebase Sync Variables
        let roomRef = null;
        let activeRoomCode = null;

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            loadAllCards();
            switchModule('sexuality');
            initFirebase();
        });

        function loadAllCards() {
            const customUserCards = JSON.parse(localStorage.getItem('closer_custom_cards') || '[]');
            masterCards = [...SEED_CARDS, ...customUserCards];
        }

        function switchModule(moduleName) {
            activeModule = moduleName;

            // Update Tab UI Styles
            document.querySelectorAll('.module-tab').forEach(tab => {
                tab.className = 'module-tab py-2.5 rounded-xl text-xs font-bold transition-all text-gray-400 flex flex-col items-center gap-0.5 glass-button';
            });

            const activeTab = document.getElementById(`tab-${moduleName}`);
            if (activeTab) {
                activeTab.className = `module-tab py-2.5 rounded-xl text-xs font-bold transition-all flex flex-col items-center gap-0.5 active-tab-${moduleName}`;
            }

            rebuildDeckAndDraw();
        }

        function setIntensity(level) {
            activeIntensity = level;
            document.querySelectorAll('.intensity-btn').forEach(btn => {
                if (btn.dataset.level === String(level)) {
                    btn.classList.add('active-filter');
                } else {
                    btn.classList.remove('active-filter');
                }
            });

            rebuildDeckAndDraw();
        }

        function rebuildDeckAndDraw() {
            let filtered = masterCards.filter(card => {
                const matchesModule = card.module === activeModule;
                const matchesIntensity = activeIntensity === 'all' || String(card.intensity) === String(activeIntensity);
                return matchesModule && matchesIntensity;
            });

            // Fisher-Yates Shuffle
            for (let i = filtered.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
            }

            unspentDeck = filtered;
            drawNextCard();
        }

        function handleCardClick() {
            drawNextCard();
        }

        function drawNextCard(remoteCard = null) {
            if (remoteCard) {
                currentCard = remoteCard;
            } else {
                if (unspentDeck.length === 0) rebuildDeckAndDraw();
                if (unspentDeck.length === 0) {
                    document.getElementById('cardPrompt').innerText = "No cards found for this filter. Add your own question!";
                    return;
                }
                currentCard = unspentDeck.pop();

                // Broadcast to Firebase Room if connected
                if (roomRef && currentCard) {
                    roomRef.child('activeCard').set(currentCard);
                }
            }

            renderCard(currentCard);
            resetTimer();
        }

        function renderCard(card) {
            const cardEl = document.getElementById('cardContainer');
            cardEl.classList.remove('card-flip-enter');
            void cardEl.offsetWidth; // Trigger reflow for animation
            cardEl.classList.add('card-flip-enter');

            document.getElementById('cardCategory').innerText = card.category || 'General';
            document.getElementById('cardPrompt').innerText = card.prompt;
            document.getElementById('intensityBadge').innerText = `⚡ Lvl ${card.intensity}`;

            // Update Favorite Star Icon
            const favIcon = document.getElementById('favIcon');
            const isFav = favoriteIds.includes(card.id);
            if (isFav) {
                favIcon.setAttribute('fill', '#ff2a85');
                favIcon.setAttribute('stroke', '#ff2a85');
            } else {
                favIcon.setAttribute('fill', 'none');
                favIcon.setAttribute('stroke', 'currentColor');
            }

            // Deck Counter
            const totalInFilter = masterCards.filter(c => c.module === activeModule && (activeIntensity === 'all' || String(c.intensity) === String(activeIntensity))).length;
            const drawnCount = totalInFilter - unspentDeck.length;
            document.getElementById('deckCounter').innerText = `Card ${drawnCount > 0 ? drawnCount : 1} of ${totalInFilter}`;

            renderResponseControls(card.contextType || 'alignment');
        }

        function renderResponseControls(contextType) {
            const bar = document.getElementById('responseBar');
            bar.innerHTML = '';
            const rules = CONTEXT_RULES[contextType] || CONTEXT_RULES.alignment;

            rules.forEach(rule => {
                const btn = document.createElement('button');
                btn.className = `py-2.5 px-2 rounded-xl text-xs font-bold border transition-all glass-button ${rule.class} active:scale-95`;
                btn.innerText = rule.label;
                btn.onclick = (e) => {
                    e.stopPropagation();
                    drawNextCard();
                };
                bar.appendChild(btn);
            });
        }

        function toggleFavorite(e) {
            e.stopPropagation();
            if (!currentCard) return;

            const idx = favoriteIds.indexOf(currentCard.id);
            if (idx > -1) {
                favoriteIds.splice(idx, 1);
            } else {
                favoriteIds.push(currentCard.id);
            }

            localStorage.setItem('closer_favs', JSON.stringify(favoriteIds));
            renderCard(currentCard);
        }

        // Action Timer Functions
        function toggleTimer() {
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                document.getElementById('timerToggleBtn').innerText = 'Start';
            } else {
                isTimerRunning = true;
                document.getElementById('timerToggleBtn').innerText = 'Pause';
                timerInterval = setInterval(() => {
                    timerSeconds--;
                    updateTimerDisplay();
                    if (timerSeconds <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        document.getElementById('timerToggleBtn').innerText = 'Done!';
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 60;
            updateTimerDisplay();
            document.getElementById('timerToggleBtn').innerText = 'Start';
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        }

        // Custom Card Management
        function saveCustomCard() {
            const mod = document.getElementById('customModule').value;
            const cat = document.getElementById('customCategory').value.trim() || 'Custom Prompt';
            const intensity = parseInt(document.getElementById('customIntensity').value);
            const prompt = document.getElementById('customPrompt').value.trim();

            if (!prompt) {
                alert("Please enter a question prompt!");
                return;
            }

            const newCard = {
                id: 'custom-' + Date.now(),
                module: mod,
                category: cat,
                intensity: intensity,
                prompt: prompt,
                contextType: mod === 'secrets' ? 'story' : (mod === 'sexuality' ? 'action' : 'alignment')
            };

            const existingCustom = JSON.parse(localStorage.getItem('closer_custom_cards') || '[]');
            existingCustom.push(newCard);
            localStorage.setItem('closer_custom_cards', JSON.stringify(existingCustom));

            loadAllCards();
            document.getElementById('customPrompt').value = '';
            toggleModal('customCardModal', false);

            switchModule(mod);
        }

        function toggleModal(modalId, show) {
            const modal = document.getElementById(modalId);
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        // Optional Firebase Realtime Sync Initializer
        function initFirebase() {
            // Optional Firebase configuration initializer block
            const firebaseConfig = {
                databaseURL: "https://closer-couples-default-rtdb.firebaseio.com"
            };

            try {
                if (window.firebase && !firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
            } catch (err) {
                console.log("Firebase sync offline or non-configured.");
            }
        }

        function openRoomModal() {
            toggleModal('roomModal', true);
        }

        function connectToRoom() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (!code) return;

            if (typeof firebase !== 'undefined' && firebase.database) {
                activeRoomCode = code;
                roomRef = firebase.database().ref('rooms/' + code);
                
                roomRef.child('activeCard').on('value', (snapshot) => {
                    const card = snapshot.val();
                    if (card && card.id !== currentCard?.id) {
                        drawNextCard(card);
                    }
                });

                document.getElementById('syncDot').className = "w-2 h-2 rounded-full bg-emerald-400 animate-pulse";
                document.getElementById('roomStatusText').innerText = code;
                document.getElementById('disconnectBtn').classList.remove('hidden');
                toggleModal('roomModal', false);
            } else {
                alert("Room sync is offline. You can continue playing locally!");
                toggleModal('roomModal', false);
            }
        }

        function disconnectRoom() {
            if (roomRef) {
                roomRef.off();
                roomRef = null;
            }
            activeRoomCode = null;
            document.getElementById('syncDot').className = "w-2 h-2 rounded-full bg-gray-500";
            document.getElementById('roomStatusText').innerText = "Pair";
            document.getElementById('disconnectBtn').classList.add('hidden');
            toggleModal('roomModal', false);
        }
    </script>
</body>
</html>
